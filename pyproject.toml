[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshroots-planner"
version = "0.1.0"
description = "Twice-weekly demand planner for Freshroots. Recommends; planners decide."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["planner*"]

[tool.setuptools.package-data]
planner = ["web/*.html", "review/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.vercel]
# Vercel's FastAPI preset: the app object to serve (see README, "Vercel (demo)").
entrypoint = "planner.api.main:app"
